<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Уют — аренда квартир</title>
<style>
:root{
  --ink:#1E1B3A; --ink2:#6B6887; --bg:#F6F4FF; --card:#FFFFFF; --line:#ECE9F7;
  --violet:#6C4CF5; --pink:#F2499B; --orange:#FF8A3D; --mint:#1FB98A; --sky:#3BA4F7; --red:#E5484D;
  --grad:linear-gradient(135deg,#6C4CF5 0%,#B347E8 45%,#F2499B 75%,#FF8A3D 100%);
  --soft:0 1px 2px rgba(30,27,58,.06),0 8px 24px rgba(108,76,245,.10);
  --r:16px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Arial,sans-serif;color:var(--ink);
  background:radial-gradient(1200px 600px at 10% 0%,#E9E1FF 0,transparent 60%),radial-gradient(900px 600px at 100% 100%,#FFE3D1 0,transparent 55%),#F3F0FF;
  display:flex;align-items:center;justify-content:center;min-height:100vh;overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid #B9A8FF;outline-offset:2px;border-radius:10px}

/* phone */
.phone{position:relative;width:390px;height:min(820px,calc(100vh - 32px));background:var(--bg);border-radius:44px;overflow:hidden;
  box-shadow:0 0 0 10px #15122B,0 0 0 11px #2C2850,0 40px 80px rgba(40,20,120,.35)}
@media (max-width:500px){body{display:block}.phone{width:100%;height:100vh;height:100dvh;border-radius:0;box-shadow:none}}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;animation:screenIn .45s cubic-bezier(.2,.8,.2,1)}
@keyframes screenIn{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.screen.slide{animation:slideIn .42s cubic-bezier(.2,.8,.2,1)}
@keyframes slideIn{from{opacity:.4;transform:translateX(40px)}to{opacity:1;transform:none}}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:16px 20px 110px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.stag>*{animation:rise .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*55ms)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

/* header */
.top{padding:52px 20px 8px;display:flex;align-items:center;justify-content:center;position:relative}
.logo{display:inline-flex;align-items:center;gap:8px;padding:8px 18px 8px 10px;border-radius:999px;background:#fff;box-shadow:var(--soft);font-weight:800;letter-spacing:-.02em}
.logo i{width:28px;height:28px;border-radius:9px;background:var(--grad);display:grid;place-items:center}
.logo i svg{width:16px;height:16px}
h1{font-size:28px;line-height:1.15;letter-spacing:-.03em;font-weight:800}
h2{font-size:20px;letter-spacing:-.02em;font-weight:750}
.muted{color:var(--ink2)}
.small{font-size:14px}

/* nav */
.nav{position:absolute;left:12px;right:12px;bottom:14px;height:70px;border-radius:24px;background:rgba(255,255,255,.88);backdrop-filter:blur(14px);
  box-shadow:0 10px 30px rgba(30,27,58,.14);display:flex;align-items:center;justify-content:space-around;z-index:20;animation:navIn .5s .1s both}
@keyframes navIn{from{transform:translateY(100px)}to{transform:none}}
.nav button{position:relative;width:64px;height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;color:#9A97B3;transition:color .25s}
.nav button svg{width:24px;height:24px;transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.nav button.on{color:var(--violet)}
.nav button.on svg{transform:translateY(-2px) scale(1.12)}
.nav button.on::after{content:"";position:absolute;bottom:2px;width:18px;height:4px;border-radius:4px;background:var(--grad);animation:pop .4s}
.nav .badge{position:absolute;top:4px;right:12px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--pink);color:#fff;font-size:11px;line-height:18px;font-weight:700}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.3)}100%{transform:scale(1)}}

/* login */
.login{background:#140F33;color:#fff;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(40px);opacity:.85;animation:float 9s ease-in-out infinite}
.b1{width:300px;height:300px;background:#6C4CF5;top:-60px;left:-80px}
.b2{width:260px;height:260px;background:#F2499B;top:180px;right:-90px;animation-delay:-3s}
.b3{width:240px;height:240px;background:#FF8A3D;bottom:-60px;left:20px;animation-delay:-6s;opacity:.6}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(30px,40px) scale(1.1)}66%{transform:translate(-20px,20px) scale(.95)}}
.login .in{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;padding:90px 28px 40px}
.hero-mark{width:84px;height:84px;border-radius:26px;background:rgba(255,255,255,.14);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.3);display:grid;place-items:center;margin-bottom:28px;animation:bob 4s ease-in-out infinite}
.hero-mark svg{width:44px;height:44px}
@keyframes bob{50%{transform:translateY(-8px) rotate(-4deg)}}
.login h1{font-size:36px}
.login p{color:rgba(255,255,255,.75);margin-top:8px}
.field{margin-top:14px;position:relative}
.field input{width:100%;height:56px;border-radius:16px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.12);backdrop-filter:blur(10px);padding:0 18px;color:#fff;outline:none;transition:border .2s,background .2s}
.field input::placeholder{color:rgba(255,255,255,.6)}
.field input:focus{border-color:#fff;background:rgba(255,255,255,.2)}
.btn{height:56px;border-radius:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s,box-shadow .2s;position:relative;overflow:hidden;width:100%}
.btn:active{transform:scale(.97)}
.btn.main{background:var(--grad);background-size:200% 200%;color:#fff;box-shadow:0 10px 24px rgba(242,73,155,.35);animation:shine 6s ease infinite}
@keyframes shine{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.btn.ghost{background:#fff;color:var(--ink)}
.login .btn.ghost{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.3)}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.5);transform:scale(0);animation:rip .6s linear;pointer-events:none}
@keyframes rip{to{transform:scale(4);opacity:0}}

/* home */
.search{display:flex;align-items:center;gap:10px;height:54px;border-radius:18px;background:#fff;box-shadow:var(--soft);padding:0 8px 0 16px}
.search input{flex:1;border:0;outline:0;background:none;min-width:0}
.ava{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;color:#fff;font-size:14px}
.chips{display:flex;gap:8px;overflow-x:auto;margin:14px -20px 0;padding:2px 20px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:40px;padding:0 16px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px;transition:all .25s}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.filter{background:var(--grad);color:#fff;border:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
.card{background:#fff;border-radius:20px;overflow:hidden;box-shadow:var(--soft);text-align:left;transition:transform .25s cubic-bezier(.3,1.4,.5,1)}
.card:hover{transform:translateY(-3px)}
.card:active{transform:scale(.97)}
.art{position:relative;aspect-ratio:1/1.05;overflow:hidden}
.art svg{width:100%;height:100%;display:block;transition:transform .6s}
.card:hover .art svg{transform:scale(1.06)}
.heart{position:absolute;top:8px;right:8px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.9);display:grid;place-items:center}
.heart svg{width:18px;height:18px}
.heart.on svg{fill:var(--pink);stroke:var(--pink);animation:pop .4s}
.tag{position:absolute;left:8px;bottom:8px;padding:4px 10px;border-radius:999px;background:rgba(20,15,51,.6);backdrop-filter:blur(6px);color:#fff;font-size:12px;font-weight:600}
.card .meta{padding:10px 12px 12px}
.price{font-weight:800;font-size:16px;letter-spacing:-.02em}
.price small{font-weight:600;color:var(--ink2);font-size:12px}
.empty{text-align:center;padding:48px 16px;color:var(--ink2)}
.section-h{display:flex;justify-content:space-between;align-items:baseline;margin-top:22px}

/* sheet */
.overlay{position:absolute;inset:0;background:rgba(20,15,51,.45);z-index:40;animation:fade .25s;display:flex;align-items:flex-end}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;background:#fff;border-radius:28px 28px 0 0;padding:12px 22px 30px;animation:up .4s cubic-bezier(.2,.9,.2,1);max-height:88%;overflow:auto}
@keyframes up{from{transform:translateY(100%)}}
.grab{width:40px;height:5px;border-radius:3px;background:#DDD9EE;margin:0 auto 16px}
.seg{display:flex;background:#F1EEFB;border-radius:14px;padding:4px;gap:4px;position:relative}
.seg button{flex:1;height:44px;border-radius:11px;font-weight:650;font-size:14px;transition:all .3s;color:var(--ink2)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(30,27,58,.1)}
.lbl{font-size:14px;font-weight:700;margin:18px 0 8px;display:flex;justify-content:space-between}
input[type=range]{width:100%;accent-color:var(--violet);height:30px}
.sel{width:100%;height:50px;border-radius:14px;border:1px solid var(--line);padding:0 14px;background:#fff}

/* detail */
.gallery{position:relative;height:46%;flex:none;overflow:hidden}
.gallery svg{width:100%;height:100%;display:block}
.gallery .slides{display:flex;height:100%;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.gallery .slides>div{flex:none;width:100%;height:100%}
.back{position:absolute;top:50px;left:16px;width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.9);display:grid;place-items:center;z-index:3;box-shadow:var(--soft)}
.dots{position:absolute;bottom:36px;left:0;right:0;display:flex;justify-content:center;gap:6px}
.dots span{width:7px;height:7px;border-radius:4px;background:rgba(255,255,255,.6);transition:all .3s}
.dots span.on{width:22px;background:#fff}
.detail{flex:1;margin-top:-24px;background:var(--bg);border-radius:28px 28px 0 0;position:relative;z-index:2;overflow:auto;padding:24px 20px 120px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}
.fact{background:#fff;border-radius:16px;padding:12px;box-shadow:var(--soft)}
.fact b{display:block;font-size:18px}
.fact span{font-size:12px;color:var(--ink2)}
.amen{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.amen span{padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600}
.cta{position:absolute;left:0;right:0;bottom:0;padding:14px 20px 26px;background:linear-gradient(transparent,var(--bg) 30%);display:flex;gap:12px;z-index:5}
.cta .btn{flex:1;white-space:nowrap;font-size:15px}.cta .btn.ghost{box-shadow:var(--soft)}
.cta .btn.ghost.on{color:var(--pink)}
.cta .btn.done{background:var(--mint);box-shadow:0 10px 24px rgba(31,185,138,.35);animation:none}
.owner{display:flex;align-items:center;gap:12px;background:#fff;border-radius:18px;padding:12px;box-shadow:var(--soft);margin-top:18px}

/* list rows */
.row{display:flex;align-items:center;gap:12px;background:#fff;border-radius:18px;padding:12px;box-shadow:var(--soft);margin-bottom:10px;width:100%;text-align:left;transition:transform .2s,opacity .3s}
.row:active{transform:scale(.98)}
.row .grow{flex:1;min-width:0}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.unread{min-width:22px;height:22px;border-radius:11px;background:var(--grad);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;padding:0 6px}
.online{position:relative}
.online::after{content:"";position:absolute;right:0;bottom:0;width:12px;height:12px;border-radius:50%;background:var(--mint);border:2px solid #fff}
.apt-pill{flex:none;width:52px;height:52px;border-radius:14px;overflow:hidden}
.apt-pill svg{width:100%;height:100%}
.acts{display:flex;gap:8px;margin-top:10px}
.acts button{flex:1;height:44px;border-radius:12px;font-weight:700;font-size:14px}
.ok{background:#E3F7EF;color:#0E8A63}.no{background:#FDECEC;color:#C2383D}
.req{display:block}
.req.out{animation:out .45s forwards}
@keyframes out{to{opacity:0;transform:translateX(60px);height:0;margin:0;padding:0}}
.status{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700}

/* chat */
.chat-top{padding:48px 16px 12px;display:flex;align-items:center;gap:12px;background:#fff;box-shadow:0 1px 0 var(--line)}
.msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:78%;padding:10px 14px;border-radius:18px;background:#fff;box-shadow:var(--soft);animation:msgIn .35s cubic-bezier(.2,1.2,.4,1)}
.msg.me{align-self:flex-end;background:var(--grad);color:#fff;border-bottom-right-radius:6px}
.msg:not(.me){border-bottom-left-radius:6px}
.msg time{display:block;font-size:11px;opacity:.7;text-align:right}
@keyframes msgIn{from{opacity:0;transform:translateY(10px) scale(.9)}}
.typing span{display:inline-block;width:7px;height:7px;border-radius:50%;background:#B7B3CF;margin:0 2px;animation:blink 1s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes blink{50%{transform:translateY(-4px);opacity:.4}}
.composer{display:flex;gap:10px;padding:10px 14px 26px;background:#fff;border-top:1px solid var(--line)}
.composer input{flex:1;height:48px;border-radius:24px;border:1px solid var(--line);padding:0 18px;outline:none;background:var(--bg)}
.send{width:48px;height:48px;border-radius:50%;background:var(--grad);display:grid;place-items:center;color:#fff}

/* contracts */
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.doc{background:#fff;border-radius:18px;padding:12px 10px;aspect-ratio:.74;gap:6px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:var(--soft);text-align:left;position:relative;overflow:hidden;transition:transform .25s cubic-bezier(.3,1.4,.5,1)}
.doc:hover{transform:translateY(-3px) rotate(-1deg)}
.doc .ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center}
.doc .ic svg{width:20px;height:20px}
.doc b{font-size:13px;line-height:1.25}
.doc small{font-size:11px;color:var(--ink2);line-height:1.3}
.doc::before{content:"";position:absolute;right:-20px;top:-20px;width:60px;height:60px;border-radius:50%;opacity:.12;background:currentColor}

/* profile */
.pf{display:flex;gap:16px;align-items:center}
.big-ava{width:104px;height:104px;border-radius:50%;padding:4px;background:var(--grad);flex:none;animation:spin 8s linear infinite}
.big-ava div{width:100%;height:100%;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:34px;font-weight:800;animation:spin 8s linear infinite reverse}
.big-ava div span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
@keyframes spin{to{transform:rotate(360deg)}}
.info{flex:1;background:#fff;border-radius:20px;padding:14px;box-shadow:var(--soft)}
.stats{display:flex;gap:14px;margin-top:6px}
.stats b{display:block;font-size:17px}
.stats span{font-size:12px;color:var(--ink2)}
.menu-row{display:flex;align-items:center;gap:12px;width:100%;height:56px;padding:0 14px;background:#fff;border-radius:16px;margin-top:10px;box-shadow:var(--soft);font-weight:600}
.menu-row .mi{width:34px;height:34px;border-radius:10px;display:grid;place-items:center}
.menu-row .chev{margin-left:auto;color:#B7B3CF}
.switch{margin-left:auto;width:50px;height:30px;border-radius:15px;background:#DDD9EE;position:relative;transition:background .25s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.15);transition:transform .3s cubic-bezier(.3,1.5,.5,1)}
.switch.on{background:var(--mint)}.switch.on::after{transform:translateX(20px)}
.logout{margin-top:22px;color:var(--red);background:#FDECEC}

.toast{position:absolute;left:50%;top:54px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-size:14px;font-weight:600;z-index:60;white-space:nowrap;animation:toast 2.4s forwards;box-shadow:0 10px 30px rgba(0,0,0,.25)}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-20px)}10%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-20px)}}
.confetti{position:absolute;width:8px;height:12px;z-index:70;pointer-events:none;border-radius:2px;animation:conf 1.2s ease-out forwards}
@keyframes conf{to{transform:translate(var(--dx),var(--dy)) rotate(var(--rot));opacity:0}}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="phone" id="app" aria-live="polite"></div>

<script>
const $ = s => document.querySelector(s);
const ICON = {
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>',
  inbox:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5h13L22 12v6a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-6z"/></svg>',
  doc:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg>',
  chat:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 21l1.9-5.4A8 8 0 1 1 21 12z"/></svg>',
  user:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>',
  heart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11z"/></svg>',
  back:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
  search:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9A97B3" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
  sliders:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>',
  send:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  house:'<svg viewBox="0 0 24 24" fill="#fff"><path d="M12 2.5 2 10.3V21a1 1 0 0 0 1 1h6.5v-6.5h5V22H21a1 1 0 0 0 1-1V10.3z"/></svg>',

  return `<section class="screen"><div class="top">${logo}</div><div class="scroll">
    <div style="display:flex;justify-content:space-between;align-items:baseline;margin-top:8px"><h2>Договоры</h2><span class="small muted">${DATA.contracts.filter(c=>c.st==='sign').length} ждут подписи</span></div>
    <div class="grid3 stag">${DATA.contracts.map((c,i)=>{const st=STATUS[c.st],l=L(c.apt);return `<button class="doc" data-doc="${i}" style="--i:${i};color:${ic[c.st]}">
      <span class="ic" style="background:${st[2]};color:${st[1]}">${ICON.doc}</span>
      <div style="color:var(--ink)"><b>Договор<br>${c.no}</b><small style="display:block;margin-top:2px" class="ell">${l.district}</small></div>
      <span class="status" style="background:${st[2]};color:${st[1]};font-size:10px;padding:2px 6px;align-self:flex-start">${st[0]}</span></button>`}).join('')}</div>
  </div>${nav()}</section>`;
},
profile(){
  const land=S.role==='landlord';
  const mine = land ? DATA.listings.filter(l=>l.owner==='Алия К.'||l.id===3) : DATA.listings.filter(l=>S.fav.has(l.id));
  return `<section class="screen"><div class="scroll stag" style="padding-top:56px">
    <div class="pf" style="--i:0"><div class="big-ava"><div><span>ДД</span></div></div>
      <div class="info"><b style="font-size:18px">Джон Донау</b><div class="small muted">${ICON.pin} Алматы · ${ICON.star} 4.9</div>
      <div class="stats"><div><b>${land?3:S.fav.size}</b><span>${land?'объекта':'избранное'}</span></div><div><b>12</b><span>договоров</span></div></div></div></div>
    <div class="seg" style="margin-top:20px;--i:1"><button class="${!land?'on':''}" data-role="tenant">Арендатор</button><button class="${land?'on':''}" data-role="landlord">Арендодатель</button></div>
    <button class="menu-row" data-sheet="settings" style="--i:2"><span class="mi" style="background:#EEE9FF;color:var(--violet)">${ICON.gear}</span>Настройки<span class="chev">›</span></button>
    <div class="section-h" style="--i:3"><h2>${land?'Мои квартиры':'Избранное'}</h2>${land?'<button class="chip" data-toast="Скоро: добавление объявления ✨" style="height:36px">+ Добавить</button>':''}</div>
    <div class="grid2" style="--i:4">${mine.length?mine.map(cardHTML).join(''):'<div class="empty" style="grid-column:1/-1">Нажмите ♡ на карточке, чтобы сохранить</div>'}</div>
    <button class="menu-row logout" data-logout style="--i:5"><span class="mi" style="background:#fff">${ICON.out}</span>Выйти</button>
  </div>${nav()}</section>`;
},
};

function sheet(kind){
  const o=document.createElement('div'); o.className='overlay';
  if(kind==='filter'){
    const ds=['Все',...new Set(DATA.listings.map(l=>l.district))];
    o.innerHTML=`<div class="sheet" role="dialog" aria-label="Фильтр"><div class="grab"></div><h2>Фильтр</h2>
      <div class="lbl">Комнаты</div><div class="seg">${[['all','Все'],['1','1'],['2','2'],['3','3+']].map(([k,t])=>`<button class="${S.rooms===k?'on':''}" data-r="${k}">${t}</button>`).join('')}</div>
      <div class="lbl">Цена до <span id="pv" style="color:var(--violet)">${fmt(S.max)}</span></div><input type="range" id="pr" min="150000" max="800000" step="10000" value="${S.max}" aria-label="Максимальная цена">
      <div class="lbl">Район</div><select class="sel" id="ds">${ds.map(d=>`<option ${d===S.district?'selected':''}>${d}</option>`).join('')}</select>
      <div style="display:flex;gap:10px;margin-top:24px"><button class="btn ghost" style="border:1px solid var(--line)" id="reset">Сбросить</button><button class="btn main" id="applyF">Показать</button></div></div>`;
    let r=S.rooms;
    o.addEventListener('click',e=>{const b=e.target.closest('[data-r]'); if(b){r=b.dataset.r;o.querySelectorAll('[data-r]').forEach(x=>x.classList.toggle('on',x===b));}});
    o.querySelector('#pr').oninput=e=>o.querySelector('#pv').textContent=fmt(+e.target.value);
    o.querySelector('#applyF').onclick=()=>{S.rooms=r;S.max=+o.querySelector('#pr').value;S.district=o.querySelector('#ds').value;close();render();toast(`Найдено: ${filtered().length}`)};
    o.querySelector('#reset').onclick=()=>{S.rooms='all';S.max=800000;S.district='Все';close();render()};
  } else if(kind==='settings'){
    o.innerHTML=`<div class="sheet" role="dialog" aria-label="Настройки"><div class="grab"></div><h2>Настройки</h2>
      <button class="menu-row" data-sw="notif"><span class="mi" style="background:#FFE0F0;color:var(--pink)">${ICON.bell}</span>Уведомления<span class="switch ${S.notif?'on':''}"></span></button>
      <button class="menu-row" data-sw="shield"><span class="mi" style="background:#E3F7EF;color:var(--mint)">${ICON.shield}</span>Только проверенные<span class="switch ${S.shield?'on':''}"></span></button>
      <button class="btn main" style="margin-top:22px" id="closeS">Готово</button></div>`;
    o.addEventListener('click',e=>{const b=e.target.closest('[data-sw]'); if(b){S[b.dataset.sw]=!S[b.dataset.sw]; b.querySelector('.switch').classList.toggle('on');}});
    o.querySelector('#closeS').onclick=close;
  } else {
    const c=DATA.contracts[kind.doc],st=STATUS[c.st],l=L(c.apt);
    o.innerHTML=`<div class="sheet" role="dialog" aria-label="Договор"><div class="grab"></div>
      <div style="display:flex;gap:14px;align-items:center"><span class="apt-pill" style="width:72px;height:72px;border-radius:18px">${thumb(l.id)}</span>
      <div><span class="status" style="background:${st[2]};color:${st[1]}">${st[0]}</span><h2 style="margin-top:4px">Договор ${c.no}</h2><div class="small muted">${l.title}</div></div></div>
      <div class="facts"><div class="fact"><b style="font-size:15px">${fmt(l.price)}</b><span>в месяц</span></div><div class="fact"><b style="font-size:15px">12 мес</b><span>срок</span></div><div class="fact"><b style="font-size:15px">01.12</b><span>начало</span></div></div>
      <p class="small muted">Арендодатель — ${l.owner} Залог равен месячной оплате, коммунальные услуги оплачиваются по счётчикам.</p>
      ${c.st==='sign'?`<button class="btn main" style="margin-top:20px" id="sign">Подписать договор</button>`:`<button class="btn ghost" style="margin-top:20px;border:1px solid var(--line)" id="closeS">Закрыть</button>`}</div>`;
    const s=o.querySelector('#sign'); if(s) s.onclick=e=>{c.st='active';confetti(e);close();render();toast('Договор подписан 🎉')};
    const cl=o.querySelector('#closeS'); if(cl) cl.onclick=close;
  }
  function close(){o.style.transition='opacity .2s';o.style.opacity=0;setTimeout(()=>o.remove(),200)}
  o.addEventListener('click',e=>{if(e.target===o)close()});
  $('#app').appendChild(o);
}

function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;$('#app').appendChild(d);setTimeout(()=>d.remove(),2500)}
function confetti(e){
  const app=$('#app'),r=app.getBoundingClientRect(); const x=(e.clientX||r.left+r.width/2)-r.left, y=(e.clientY||r.top+r.height-60)-r.top;
  const cs=['#6C4CF5','#F2499B','#FF8A3D','#1FB98A','#3BA4F7','#FFC53D'];
  for(let i=0;i<36;i++){const p=document.createElement('i');p.className='confetti';p.style.left=x+'px';p.style.top=y+'px';p.style.background=cs[i%6];
    const a=Math.random()*Math.PI*2,d=80+Math.random()*160;p.style.setProperty('--dx',Math.cos(a)*d+'px');p.style.setProperty('--dy',(Math.sin(a)*d-120)+'px');p.style.setProperty('--rot',(Math.random()*720)+'deg');
    app.appendChild(p);setTimeout(()=>p.remove(),1300)}
}

function render(){
  const app=$('#app'); app.querySelectorAll('.screen,.overlay').forEach(n=>n.remove());
  const key = S.screen==='app' ? S.tab : S.screen;
  app.insertAdjacentHTML('afterbegin', V[key]());
  if(key==='convo'){const m=$('#msgs');m.scrollTop=m.scrollHeight}
}
function go(screen,extra={}){Object.assign(S,extra);S.screen=screen;render()}

let hist=[];
document.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-fav],[role=button]'); if(!t) return;
  if(t.classList.contains('btn')){const r=t.getBoundingClientRect(),s=Math.max(r.width,r.height),sp=document.createElement('span');sp.className='ripple';sp.style.cssText=`width:${s}px;height:${s}px;left:${e.clientX-r.left-s/2}px;top:${e.clientY-r.top-s/2}px`;t.appendChild(sp);setTimeout(()=>sp.remove(),600)}
  const d=t.dataset;
  if(d.fav){e.stopPropagation();const id=+d.fav;S.fav.has(id)?S.fav.delete(id):S.fav.add(id);t.classList.toggle('on');if(S.tab==='profile')render();toast(S.fav.has(id)?'Добавлено в избранное ♥':'Убрано из избранного');return}
  if(d.go==='login'){setTimeout(()=>go('app',{tab:'home'}),250);return}
  if(d.tab){hist=[];go('app',{tab:d.tab});return}
  if(d.open){hist.push({screen:S.screen,tab:S.tab,chat:S.chat});go('apt',{apt:+d.open,slide:0});return}
  if(d.back!==undefined){const h=hist.pop()||{screen:'app'};go(h.screen,h);return}
  if(d.favbtn){const id=+d.favbtn;S.fav.has(id)?S.fav.delete(id):S.fav.add(id);render();return}
  if(d.apply){const id=+d.apply;if(!S.applied.has(id)){S.applied.add(id);confetti(e);render();toast('Отклик отправлен арендодателю 🚀')}return}
  if(d.rooms){S.rooms=d.rooms;render();return}
  if(d.sheet){sheet(d.sheet);return}
  if(d.chat){hist.push({screen:'app',tab:'chat'});DATA.chats[+d.chat].u=0;go('convo',{chat:+d.chat});return}
  if(d.chatwith){let i=DATA.chats.findIndex(c=>c.n===d.chatwith);if(i<0){DATA.chats.unshift({n:d.chatwith,c:'#F2499B',last:'Здравствуйте!',t:'сейчас',u:0,on:true,apt:null});i=0}hist.push({screen:S.screen,tab:S.tab});go('convo',{chat:i});return}
  if(d.reqtab){S.reqTab=d.reqtab;render();return}
  if(d.acc||d.dec){const i=+(d.acc||d.dec);$('#r'+i).classList.add('out');setTimeout(()=>{S.handled.add(i);if(d.acc){S.accepted.push(i)}render();toast(d.acc?'Заявка принята ✅':'Заявка отклонена')},420);if(d.acc)confetti(e);return}
  if(d.doc){sheet({doc:+d.doc});return}
  if(d.role){S.role=d.role;render();return}
  if(d.toast){toast(d.toast);return}
  if(d.logout!==undefined){go('login');return}
});
document.addEventListener('input',e=>{
  if(e.target.id==='q'){S.q=e.target.value;const g=$('#grid'),l=filtered();g.innerHTML=l.length?l.map(cardHTML).join(''):'<div class="empty" style="grid-column:1/-1">Ничего не нашлось 🙈</div>';document.querySelector('.section-h .muted').textContent=l.length+' вариантов'}
});
document.addEventListener('submit',e=>{
  if(e.target.id!=='composer')return; e.preventDefault();
  const inp=$('#mi'),t=inp.value.trim(); if(!t)return;
  const now=new Date(),h=now.toTimeString().slice(0,5),box=$('#msgs'),arr=S.msgs[S.chat];
  arr.push({me:true,t,h}); box.insertAdjacentHTML('beforeend',`<div class="msg me">${t.replace(/</g,'&lt;')}<time>${h}</time></div>`); inp.value=''; box.scrollTop=box.scrollHeight;
  const ty=document.createElement('div');ty.className='msg typing';ty.innerHTML='<span></span><span></span><span></span>';
  setTimeout(()=>{box.appendChild(ty);box.scrollTop=box.scrollHeight},400);
  const replies=['Отлично, договорились!','Хорошо, пришлю детали чуть позже 🙂','Да, конечно. Когда вам удобно?','Спасибо! Жду вас 😊'];
  setTimeout(()=>{ty.remove();const r=replies[Math.floor(Math.random()*replies.length)];arr.push({me:false,t:r,h});box.insertAdjacentHTML('beforeend',`<div class="msg">${r}<time>${h}</time></div>`);box.scrollTop=box.scrollHeight},1700);
});
// gallery swipe / tap
let sx=null;
document.addEventListener('pointerdown',e=>{if(e.target.closest('#gal')&&!e.target.closest('.back'))sx=e.clientX});
document.addEventListener('pointerup',e=>{if(sx===null)return;const dx=e.clientX-sx;sx=null;const g=$('#gal');if(!g)return;
  S.slide=Math.abs(dx)>30?(S.slide+(dx<0?1:2))%3:(S.slide+1)%3;
  g.querySelector('.slides').style.transform=`translateX(-${S.slide*100}%)`;g.querySelectorAll('.dots span').forEach((s,i)=>s.classList.toggle('on',i===S.slide))});

// deep link for previews: #home, #apt, #chat ...
const h=location.hash.slice(1);
if(h==='apt')go('apt',{apt:2});else if(h==='convo')go('convo',{chat:0});else if(['home','reqs','docs','chat','profile'].includes(h))go('app',{tab:h});else render();
</script>
</body>
</html>
